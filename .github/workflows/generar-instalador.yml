name: Generar instalador de VideoFácil

on:
  push:
    branches: [main]
    paths: [VideoFacil.zip]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      version: ${{ steps.proyecto.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extraer y comprobar el ZIP
        id: proyecto
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath VideoFacil.zip -DestinationPath proyecto
          $app = Get-Content -Raw -LiteralPath proyecto/VideoFacil/app.py
          $inno = Get-Content -Raw -LiteralPath proyecto/VideoFacil/instalador.iss
          $appVersion = [regex]::Match($app, '(?m)^VERSION\s*=\s*[''"]([0-9]+\.[0-9]+\.[0-9]+)[''"][ \t]*\r?$')
          $setupVersion = [regex]::Match($inno, '(?m)^AppVersion=([0-9]+\.[0-9]+\.[0-9]+)[ \t]*\r?$')
          if (-not $appVersion.Success -or -not $setupVersion.Success -or
              $appVersion.Groups[1].Value -ne $setupVersion.Groups[1].Value) {
            throw 'La versión de app.py debe coincidir con AppVersion en instalador.iss.'
          }
          "version=$($appVersion.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64

      - name: Preparar y compilar VideoFácil
        working-directory: proyecto/VideoFacil
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r requirements.txt
          python preparar_motor.py
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name VideoFacil --icon VideoFacil.ico --add-binary "yt-dlp.exe;." --collect-all imageio_ffmpeg app.py

      - name: Generar el instalador con Inno Setup
        working-directory: proyecto/VideoFacil
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $candidatos = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidatos | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $candidatos | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw 'No se encontró ISCC.exe de Inno Setup 6.'
          }
          & $iscc instalador.iss

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instalador-windows
          path: proyecto/VideoFacil/salida/VideoFacil-Setup.exe
          if-no-files-found: error
          retention-days: 3

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publicar-videofacil
      cancel-in-progress: false

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: instalador-windows
          path: salida

      - name: Publicar el instalador si la versión es nueva
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.compilar.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::El ZIP no contiene un número de versión válido."
            exit 1
          fi
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          latest=$(printf '%s\n' "$tags" | awk '/^v?[0-9]+\.[0-9]+\.[0-9]+$/ { sub(/^v/, ""); print }' | sort -V | tail -n 1)
          if [[ -n "$latest" ]]; then
            highest=$(printf '%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)
            if [[ "$VERSION" == "$latest" || "$VERSION" != "$highest" ]]; then
              echo "El instalador se compiló. Ya está publicada la v$latest."
              exit 0
            fi
          fi
          gh release create "v$VERSION" salida/VideoFacil-Setup.exe \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "VideoFácil v$VERSION" --notes 'Instalador de VideoFácil para Windows x64.'
